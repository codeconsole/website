---
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
grails:
    codegen:
        defaultPackage: website
    profile: web

---
grails:
    views:
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                scriptlet: html

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
dataSource:
    pooled: true
    jmxExport: true
    driverClassName: org.h2.Driver
    username: sa
    password: ''

environments:
    development:
        dataSource:
            dbCreate: create-drop
            url: jdbc:h2:mem:devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    test:
        dataSource:
            dbCreate: update
            url: jdbc:h2:mem:testDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    production:
        dataSource:
            dbCreate: none
            url: jdbc:h2:./prodDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
            properties:
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 600000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 15000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED

---
# Added by the Spring Security Core plugin:
grails:
    plugin:
        springsecurity:
            userLookup:
                userDomainClassName: 'website.User'
                authorityJoinClassName: 'website.UserRole'
            authority:
                className: 'website.Role'
            controllerAnnotations:
                staticRules:
                    - pattern: /
                      access: ['permitAll']
                    - pattern: /error
                      access: ['permitAll']
                    - pattern: /index
                      access: ['permitAll']
                    - pattern: /index.gsp
                      access: ['permitAll']
                    - pattern: /shutdown
                      access: ['permitAll']
                    - pattern: /assets/**
                      access: ['permitAll']
                    - pattern: /**/js/**
                      access: ['permitAll']
                    - pattern: /**/css/**
                      access: ['permitAll']
                    - pattern: /**/images/**
                      access: ['permitAll']
                    - pattern: /**/favicon.ico
                      access: ['permitAll']
                    - pattern: /register/**
                      access: ['permitAll']
                    - pattern: /user/**
                      access: ['ROLE_ADMIN']
                    - pattern: /role/**
                      access: ['ROLE_ADMIN']
                    - pattern: /requestmap/**
                      access: ['ROLE_ADMIN']
                    - pattern: /persistentLogin/**
                      access: ['ROLE_ADMIN']
                    - pattern: /registrationCode/**
                      access: ['ROLE_ADMIN']
                    - pattern: /securityInfo/**
                      access: ['ROLE_ADMIN']
            filterChain:
                chainMap:
                    - pattern: /assets/**
                      filters: none
                    - pattern: /**/js/**
                      filters: none
                    - pattern: /**/css/**
                      filters: none
                    - pattern: /**/images/**
                      filters: none
                    - pattern: /**/favicon.ico
                      filters: none
                    - pattern: /**
                      filters: JOINED_FILTERS
